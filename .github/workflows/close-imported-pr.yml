# The end of an imported contribution. The change was merged internally and has
# just been replayed onto this mirror by the outbound publish; this workflow
# works out which pull request it came from, says where it landed, and closes
# the pull request.
#
# The comment deliberately does NOT claim the contributor authored the published
# commit. Measured end to end: with `merge_method: merge` on the internal
# project, Copybara follows first parent and so replays the MERGE commit, whose
# author is whoever merged. The contributor's authorship survives on the
# internal side and dies at the merge. `merge_method: ff` or `rebase_merge`
# would publish their commit directly -- until that is set, saying "with you as
# the commit author" here would be false.
#
# GitHub will show that pull request as closed rather than merged, and the
# contributor gets no merged-pull-request entry on their profile. That cost was
# accepted deliberately (q4 #1) and every GitLab-first project surveyed pays it.
# This comment is the entire compensation, which is why it names the published
# commit, links it, and thanks the contributor by name rather than reading like
# a bot closing a ticket.
#
# How the link survives: the import puts a `GitHub-PR:` trailer in the merge
# request's description, `merge_commit_template` carries `%{description}` into
# the merge commit, and Copybara replays that message verbatim. So the trailer
# rides in the body through all three hops and nothing has to be looked up in an
# internal system.
#
# A trailer rather than a subject-line prefix, deliberately. The subject belongs
# to the contributor and should say what the change does — it is the line that
# ends up in `git log` here and in every changelog generated from it. A trailer
# is also unambiguous: a contributor who writes "fix the GitHub PR #12 typo" as
# their own title cannot make this workflow close pull request 12.
#
# No stored credential: GITHUB_TOKEN already has write access inside this
# repository, which is why the closing happens here and not on the side that
# knows the published SHA first.
name: close-imported-pr

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The push range, not just the tip: one publish can replay several
          # merges, and a missed one leaves a pull request open forever with no
          # sign anything happened.
          fetch-depth: 0

      - name: Close the pull requests this push published
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REPO_URL: ${{ github.event.repository.html_url }}
        run: |
          set -euo pipefail
          # A first push, or a force-push, has no usable lower bound; look at the
          # tip alone rather than walking the whole history and reopening old
          # ground.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            range="-1 $AFTER"
          else
            range="$BEFORE..$AFTER"
          fi

          # shellcheck disable=SC2086
          for sha in $(git log --format='%H' $range); do
            # The trailer, from the body. `git log --format=%(trailers:...)`
            # would be tidier but only sees trailers git itself recognises as a
            # block; a grep over the message is what survives Copybara having
            # appended its own GitOrigin-RevId line after ours.
            number=$(git log -1 --format='%B' "$sha" | sed -nE 's/^GitHub-PR:[[:space:]]*#?([0-9]+)[[:space:]]*$/\1/p' | head -1)
            [ -n "$number" ] || continue

            state=$(gh pr view "$number" --json state --jq .state 2>/dev/null || echo MISSING)
            if [ "$state" != "OPEN" ]; then
              echo "PR #$number is $state; nothing to close"
              continue
            fi
            author=$(gh pr view "$number" --json author --jq .author.login)

            gh pr comment "$number" --body "$(cat <<EOF
          Thank you, @$author.

          This landed as [\`${sha:0:12}\`]($REPO_URL/commit/$sha) on \`main\`.

          Development happens in an internal repository and this mirror is published from it, so the change was merged there and replayed here. That is why this pull request closes rather than merges — the code is in, even though GitHub cannot show it that way.
          EOF
          )"
            gh pr close "$number"
            echo "closed PR #$number for $sha"
          done
