# A maintainer asks for a pull request to be imported and tested internally.
#
# This workflow can ASK, never authorize. Asking is now the whole of it: it
# applies a label and says so on the pull request. Nothing here talks to the
# internal side, because nothing here can.
#
# WHY IT NO LONGER TRIGGERS ANYTHING. The design had this workflow fire a GitLab
# pipeline trigger. Run for real, with the trigger token and the project API URL
# in place as repository secrets, it fails at the network with
# `curl: (6) Could not resolve host` -- the host deliberately not named here,
# because this file is published and an internal hostname is exactly what the
# publish gate exists to keep off the mirror. (It was named here once. gitleaks
# refused the publish, which is the system working.)
#
# That is structural rather than a misconfiguration. GitHub's hosted runners sit
# on the public internet; the internal GitLab is neither resolvable nor routable
# from there, and no credential arrangement changes it. So the start signal is
# inverted: an internal scheduled pipeline polls api.github.com for pull requests
# carrying the label this workflow applies, which is reachability the flow
# already depends on and which was measured working from a real GitLab runner.
# See .gitlab/ci/inbound-import.yml and sync/src/repo_sync/poll.py.
#
# WHAT THAT COSTS, AND WHY THE COMMENT BELOW IS WORDED AS IT IS. The old version
# polled the pipeline and reported the outcome back here. Nothing can do that
# now: no GitHub write credential exists on the internal side, which is a
# property of the design rather than an oversight, and this workflow's run is
# over long before the import happens. A successful import still reaches the
# contributor -- close-imported-pr.yml comments and closes when the change lands
# -- but a refusal is silent publicly and a maintainer explains it by hand. The
# comment therefore promises only what the machinery can actually deliver.
#
# workflow_dispatch rather than a comment trigger: only accounts with write
# access can start it, which is the same trust boundary copy-pr-bot draws with
# `/ok to test`. The label carries no authority of its own -- the import gate
# re-reads approval and check status from GitHub before fetching anything -- but
# a label anyone could apply would still let anyone queue internal work.
name: import-pr

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to import"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: import-pr-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This workflow checks nothing out -- it needs no source, only the API. So
    # `gh` has no git remote to infer the repository from and fails with
    # "not a git repository" unless it is told. Measured: the first real run
    # died on exactly that.
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr }}
      # Must match INBOUND_LABEL in sync/copy.bara.sky, which is where the
      # internal poll reads it from. Two copies, because the internal file is
      # not published; a mismatch means labelled pull requests are never picked
      # up, which is why the poll logs how many it found.
      LABEL: import-approved
    steps:
      - name: Refuse to run from anything but the default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::run this from ${{ github.event.repository.default_branch }}"
          exit 1

      - name: Check the pull request is open
        run: |
          set -euo pipefail
          case "$PR" in
            ''|*[!0-9]*) echo "::error::pull request number must be digits"; exit 1 ;;
          esac
          state=$(gh pr view "$PR" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "::error::PR #$PR is $state"
            exit 1
          fi

      - name: Label it for import
        run: |
          set -euo pipefail
          # --force so a label that does not exist yet is created rather than
          # failing the run on a fresh repository.
          gh label create "$LABEL" --description "Queued for internal import" --color 0E8A16 --force
          gh pr edit "$PR" --add-label "$LABEL"

      - name: Say what happens next
        run: |
          set -euo pipefail
          gh pr comment "$PR" --body "$(cat <<'EOF'
          Queued for internal import. Development happens in an internal repository, so this change will be imported there, reviewed, and merged — then replayed onto this mirror.

          When it lands, this pull request will close automatically with a link to the published commit. If the import cannot proceed, a maintainer will follow up here; the internal side has no way to write to this pull request, so silence means it is still in the queue rather than that something failed.
          EOF
          )"
