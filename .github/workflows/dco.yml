# Developer Certificate of Origin, checked on the pull request and before any
# import. This repository takes third-party commits into an internal NVIDIA
# repository, and the sign-off is what establishes the contributor's right to
# submit them — a legal question rather than a technical one, so it is answered
# self-serve, in public, and early, rather than by a maintainer after the fact.
#
# The job is named `dco` because that name is the contract twice over: it is a
# required status on the branch, and it is listed in `required_check_runs` on
# the inbound Copybara workflow. Renaming the job removes a gate in both places
# and nothing fails until an unsigned commit reaches an internal runner.
#
# Written out rather than delegated to a third-party action: NVIDIA allowlists
# actions and requires SHA pinning for anything external, and the whole check is
# a grep over the pull request's own commits.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Every commit in the pull request is checked, not just the tip: the
          # certificate is per commit, and a squash on merge is not guaranteed.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Every commit carries a Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_SHA"
          failed=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            author=$(git show -s --format='%an <%ae>' "$sha")
            if git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>$"; then
              continue
            fi
            echo "::error::$sha ($author) has no Signed-off-by trailer"
            failed=1
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          if [ "$failed" -ne 0 ]; then
            echo "::error::Sign off with 'git commit -s', then 'git rebase --signoff' for existing commits."
          fi
          exit "$failed"
