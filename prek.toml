# Style enforcement, run by prek (https://github.com/j178/prek) locally via git
# hooks (`prek install -t pre-commit -t commit-msg`) and in CI, only on new and
# changed files.
#
# Mirrors the hook set of the production repo this sandbox rehearses, so a
# Copybara round-trip is exercised against the real style gate rather than a
# simplified one. See docs/coding.md.

# Never touch the generated embedded CUBIN headers (byte arrays emitted by
# cpp/tools/prepare_cubins.py; reformatting or license-stamping them would churn
# the diff and fight the generator), or the CuTeDSL kernels (the DSL resolves
# names through its own tracing machinery, so ruff reports them as undefined).
exclude = '''(?x)^(
    .*\.(a|lib|so|dll|cubin|pt|npy)
  | torch_cuda/dsl_kernels/cute/.*
)$'''

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.1"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
# C/C++/CUDA formatting for cpp/ (handwritten kernels/bindings; see
# .clang-format). Pinned to one version so output doesn't ping-pong across
# machines.
repo = "https://github.com/pre-commit/mirrors-clang-format"
rev = "v22.1.8"
hooks = [
  # .h/.hpp/.cuh are already tagged c/c++/cuda by identify, so these three
  # types cover headers too (there is no "h" tag; the header tag is "header").
  { id = "clang-format", types_or = ["c", "c++", "cuda"] },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.49"
hooks = [
  { id = "rumdl", args = ["--fix"] },
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [
  { id = "shellcheck" },
]

[[repos]]
repo = "https://github.com/maxwinterstein/shfmt-py"
rev = "v4.0.0"
hooks = [
  # -i 2: 2-space indent; -ci: indent switch cases; -bn: binary ops at line start.
  { id = "shfmt", args = ["-w", "-i", "2", "-ci", "-bn"] },
]

[[repos]]
repo = "https://github.com/Lucas-C/pre-commit-hooks"
rev = "v1.5.6"
hooks = [
  # Short SPDX header on all source (.license-header.txt).
  # --use-current-year matches any existing header regardless of its year/range
  # (so existing headers are left alone) and stamps new files with the current
  # year; only inserts where missing. Two entries: `#` comment style for
  # python/shell/cmake, C-block style for c/c++/cuda.
  { id = "insert-license", name = "insert license (python, shell, cmake)", types_or = [
    "python",
    "shell",
    "cmake",
  ], args = [
    "--license-filepath",
    ".license-header.txt",
    "--comment-style",
    "#",
    "--use-current-year",
  ] },
  { id = "insert-license", name = "insert license (c, c++, cuda)", types_or = [
    "c",
    "c++",
    "cuda",
  ], args = [
    "--license-filepath",
    ".license-header.txt",
    "--comment-style",
    "/*| *| */",
    "--use-current-year",
  ] },
]

[[repos]]
# Per-commit title linting (commit-msg stage): enforces the Conventional Commits
# subject via `cz check`. Config in pyproject.toml [tool.commitizen]. Requires
# the commit-msg shim: `prek install -t pre-commit -t commit-msg`.
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.17.0"
hooks = [
  { id = "commitizen" },
]

# outbound coverage: touched so every published path has a real last-commit message
